
services:
  # ─── Bancos de Dados ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped #always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: hotel-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?Defina MONGO_INITDB_ROOT_USERNAME no arquivo .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Defina MONGO_INITDB_ROOT_PASSWORD no arquivo .env}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hotel-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER no arquivo .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS no arquivo .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Core Service) ─────────────────────────────────────────────────
  core-service:
    build:
      context: ./apps/services/core-service
      dockerfile: Dockerfile
    container_name: hotel-core-service
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER:?Defina POSTGRES_SERVER no arquivo .env}
      - POSTGRES_USER=${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      - POSTGRES_PORT=${POSTGRES_PORT:?Defina POSTGRES_PORT no arquivo .env}
      - MONGODB_URL=${MONGODB_URL:?Defina MONGODB_URL no arquivo .env}
      - MONGODB_DB=${MONGODB_DB:?Defina MONGODB_DB no arquivo .env}
      - RABBITMQ_URL=${RABBITMQ_URL:?Defina RABBITMQ_URL no arquivo .env}
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "
        poetry run alembic upgrade head &&
        poetry run python -m app.core.seed_mongo &&
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  audit-worker:
    build:
      context: ./apps/services/core-service
      dockerfile: Dockerfile
    container_name: hotel-audit-worker
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER:?Defina POSTGRES_SERVER no arquivo .env}
      - POSTGRES_USER=${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      - POSTGRES_PORT=${POSTGRES_PORT:?Defina POSTGRES_PORT no arquivo .env}
      - MONGODB_URL=${MONGODB_URL:?Defina MONGODB_URL no arquivo .env}
      - MONGODB_DB=${MONGODB_DB:?Defina MONGODB_DB no arquivo .env}
      - RABBITMQ_URL=${RABBITMQ_URL:?Defina RABBITMQ_URL no arquivo .env}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: poetry run python -m app.workers.audit_worker

  # ─── Frontend (React + Vite) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: hotel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - core-service

volumes:
  postgres_data:
  mongo_data:
